<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Biloba - A Proximité</title>
    <link rel="stylesheet" href="style_favoris.css">
    <base href="/Biloba/">
    <script src="https://api.ginko.voyage/api.js?apiKey=r8B7t6Hgd7vF9V3VV9PQ4vc2a"></script>
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes"> 
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta http-equiv="Cache-Control" content="no-cache">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    
</head>
<body>
    <div class="header">
        <h1 class="logo lightmode">Biloba</h1>

        
    </div>
    <div class="content">
      <div class="titre lightmode"><h2>Biloba</h2></div>
        
        <div class="line-container"><i class="fa-solid fa-circle lightmode circle1"></i> <i class="fa-solid fa-circle lightmode circle2"></i> <i class="fa-solid fa-circle lightmode circle3"></i></div>
        <script>
          // var globales
          const conteneur = document.querySelector(".line-container");

          let listearretsproche = {};
          

// fonction async principale
const chargerarrets = async () => {
  try {
    let fav_arret = JSON.parse(localStorage.getItem('fav_arrets')) || [];
    
    
      const arretsproches = fav_arret.map((a) => `<a href="horaires.html?arret=${a}&provenance=Favoris" class="line-link"><span>${a}</span></a><br>`).join("");  
        conteneur.innerHTML = arretsproches
        if (arretsproches === "") {conteneur.innerHTML = `<p class="lightmode">Aucun arrêts proche n'a été trouvé. Vous êtes bien dans le Grand Besançon ?</p>`}
        console.log(arretsproches)
        document.querySelector(".titre").innerHTML = "<h2>Arrêts Favoris</h2>"
    }

   catch (error) {
    document.querySelector(".titre").innerHTML = "<h2>Erreur</h2>"
    conteneur.innerHTML = `<p class="lightmode">Impossible de vous localiser.</p>
    <p class="lightmode">Assurez-vous d'avoir autorisé Biloba et votre navigateur à accéder à votre position</p>`;
    console.error(error);
  }
};


chargerarrets();

  </script>
  

    </div>
    </div>
    <div class="bar-container">
    <nav class="top-bar">

                <li class="bar"><a href="index.html">Lignes</a></li>
                <li class="bar"><a href="carte.html">Carte</a></li>
                <li class="selected bar "><a href="carte.html">Favoris</a></li>
                <li class="bar"><a href="proche.html">Proches</a></li>

            </ul>
        </nav>
        </div><br><br>
</body>
</html>
