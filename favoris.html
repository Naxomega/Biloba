<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Biloba - A Proximité</title>
    <link rel="stylesheet" href="style_favoris.css">
    <base href="/Biloba/">
    <script src="https://api.ginko.voyage/api.js?apiKey=r8B7t6Hgd7vF9V3VV9PQ4vc2a"></script>
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes"> 
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta http-equiv="Cache-Control" content="no-cache">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    
</head>
<body>
    <div class="header">
        <h1 class="logo lightmode">Biloba</h1>

        
    </div>
    <div class="buttonbar"></div>
    <div class="content">

        
        <div class="line-container"><i class="fa-solid fa-circle lightmode circle1"></i> <i class="fa-solid fa-circle lightmode circle2"></i> <i class="fa-solid fa-circle lightmode circle3"></i></div>
        <script>
          // var globales
          const conteneur = document.querySelector(".line-container");
          const boutons = document.querySelector(".buttonbar")

const drawLignes = () => {
  
    let fav_ligne = JSON.parse(localStorage.getItem('fav_ligne')) || [];
    
    
      const arretsproches = fav_ligne.map((a) => `<a href="horaires.html?arret=${a}&provenance=Favoris" class="line-link"><span>${a}</span></a><br>`).join("");  
        conteneur.innerHTML = arretsproches
        if (arretsproches === "") {conteneur.innerHTML = `<p class="lightmode">Vous n'avez ajouté aucune ligne en favoris (bouton étoile)</p>`}
        console.log(arretsproches)
    
    
        boutons.innerHTML = `<a onclick="drawArrets(); return true"><p>Arrêts</p></a>
        <a class="selected" onclick="drawLignes(); return true"><p>Lignes</p></a>
        <a onclick="drawDestinations(); return true"><p>Destinations</p></a>`
            
    

   
};    
const drawDestinations = () => {
  
    let fav_dest = JSON.parse(localStorage.getItem('fav_dest')) || [];
    
    
      const arretsproches = Object.values(fav_dest).map((a) => `<a href="dest.html?ligne=${a.ligne}&provenance=Favoris" class="line-link"><span>${a.ligne} vers ${a.destination}</span></a><br>`).join("");  
        conteneur.innerHTML = arretsproches
        if (arretsproches === "") {conteneur.innerHTML = `<p class="lightmode">Vous n'avez ajouté aucune destination en favoris (bouton étoile)</p>`}
        console.log(arretsproches)
    
    
        boutons.innerHTML = `<a onclick="drawArrets(); return true"><p>Arrêts</p></a>
        <a onclick="drawLignes(); return true"><p>Lignes</p></a>
        <a class="selected" onclick="drawDestinations(); return true"><p>Destinations</p></a>`
            
    

   
};      



const drawArrets = () => {
  
    let fav_arret = JSON.parse(localStorage.getItem('fav_arrets')) || [];
    
    
      const arretsproches = fav_arret.map((a) => `<a href="horaires.html?arret=${a}&provenance=Favoris" class="line-link"><span>${a}</span></a><br>`).join("");  
        conteneur.innerHTML = arretsproches
        if (arretsproches === "") {conteneur.innerHTML = `<p class="lightmode">Vous n'avez ajouté aucun arrêt en favoris (bouton étoile)</p>`}
        console.log(arretsproches)
    boutons.innerHTML = `<a class="selected" onclick="drawArrets(); return true"><p>Arrêts</p></a>
        <a onclick="drawLignes(); return true"><p>Lignes</p></a>
        <a onclick="drawDestinations(); return true"><p>Destinations</p></a>`
            
    

   
};


drawArrets();

  </script>
  

    </div>
    </div>
    <div class="bar-container">
    <nav class="top-bar">
            <ul class="insert">
                <li class="bar"><a href="index.html">Lignes</a></li>
                <li class="bar"><a href="carte.html">Carte</a></li>
                <li class="selected bar "><a href="favoris.html">Favoris</a></li>
                <li class="bar"><a href="proche.html">Proches</a></li>

            </ul>
        </nav>
        </div><br><br>
</body>
</html>
