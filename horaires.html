<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="60" >

    <title>Biloba - Horaires Ginko</title>
    <link rel="stylesheet" href="style_horaires.css">
    <base href="/Biloba/">
    <script src="https://api.ginko.voyage/api.js?apiKey=1ca8f7cc8b9f96ddca225b8fc7ccecc8"></script>
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes"> 
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
</head>
<body>
    <div class="header">
        <h1 class="logo lightmode">Biloba</h1>
        <h3>Aussi léger qu'une feuille de Ginko</h3>
        <nav class="top-bar">
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="arrets.html">Arrêts</a></li>
                <li><a href="contribuer.html">Contribuer</a></li>
            </ul>
        </nav>
    </div>
    <div class="content">
      <div class="titre lightmode"><h2>Biloba</h2></div>
        <br>
        <div id="temps-reel">Chargement des horaires...</div>
        <script>

    const urlParams = new URLSearchParams(window.location.search);
    const sstop = urlParams.get('arret');
    const line = urlParams.get('ligne');
    const dest = urlParams.get('destination')
    const destalt = urlParams.get('destinationalt')
    const correspondances = []; // Tableau vide pour correspondances
    const callGinko = (methodPath, args = {}) => {
      return new Promise((resolve, reject) => {
        ginkoAPI(
          methodPath,
          args,
          (data) => resolve(data), // Fonction API Ginko
          (err) => reject(err)
        );
      });
    };

    // 2. Fonction principale pour récupérer et afficher les horaires
    const afficherHoraires = async (nomArret, ligne, destination, destinationalt) => {
  const conteneur = document.querySelector("#temps-reel");
  const titre = document.querySelector('.titre');
  const pagetitre = document.querySelector('title');

  try {
    const response = await callGinko("TR/getTempsLieu", { nom: nomArret });
    
    
    console.log("Réponse de l'API :", response);

    
    const passages = response.listeTemps;
    if (passages.length == 0) {
      conteneur.innerHTML = "<p>Aucun passage trouvé pour cet arrêt.</p>";
      return;
    }
    passages.forEach((p) => { // Correspondances

  if (p.numLignePublic !== ligne && correspondances.indexOf(p.numLignePublic) === -1) {
    correspondances.push(p.numLignePublic);
  }
});

    // 3. Affichage
    let passagefiltre = passages.filter((a) => a.numLignePublic===ligne && (a.destination===destination || a.destination===destinationalt));
    let tempsfiltre = passagefiltre.map((p) => p.temps).join(`</span></strong><strong><span class="bulle">`)
    console.log(passagefiltre);
    console.log(tempsfiltre);
    let passageunique = passagefiltre.slice(0, 1)
    if (tempsfiltre.length !== 0) {
      conteneur.innerHTML = passageunique
      .map((p) => `
        <div class="passage tile-${ligne.toLowerCase()} lightmode">
          <strong><p class="line-dot line-${ligne.toLowerCase()} enlarge outline">${p.numLignePublic}</p></strong> <p> 
         <strong>${p.destination}</strong>
          <br><span class="bulle"><strong>${tempsfiltre}</strong></span></p>

        </div><br>
      `)
      .join("");
    }
    


  } catch (erreur) {
    console.error("Erreur :", erreur);
    conteneur.innerHTML = `<p style="color:red">Erreur : ${erreur}</p>`;
  }
  titre.innerHTML = `<h2>Ligne ${ligne} vers ${destination}<br><br>${nomArret}</h2>`;
  const htmlCorrespondances = correspondances
  .map((num) => `<p class="line-dot line-${num.toLowerCase()}">${num}</p>`)
  .join("");
  document.querySelector(".line-dots").innerHTML = htmlCorrespondances || `<p class="lightmode">Aucune correspondance directe</p>`;
  pagetitre.innerHTML = `Biloba - ${ligne} - ${nomArret}`
};


    afficherHoraires(sstop, line, dest, destalt);
  </script>
  <h3 class="lightmode list-title">Correspondances : </h3>
<div class="line-dots">

        </div>

    </div>
</body>
</html>
