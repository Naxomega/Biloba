    const urlParams = new URLSearchParams(window.location.search);

    const type_arret = async () => {
      const infosjson = await fetch('./infos_arrets.json')

                    }
                    return response.json();  
                })
                .then()  
                .catch(error => console.error('Failed to fetch data:', error)); 
                
                const infos_arret = infosjson.find(a => a.nom_arret === arretcible) || "undef"
                return infos_arret.type || "undef"
                
    }
    const id_gare = async () => {
      const infosjson = await fetch('./infos_arrets.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json();  
                })

    const nom_gare = async () => {
      const infosjson = await fetch('./infos_arrets.json')
                .then(response => {

                    }
                    return response.json();

                return infos_arret.nom_sncf || "undef"
                
    }
    const correspondances = []; // Tableau vide pour correspondances
    const callGinko = (methodPath, args = {}) => {
      return new Promise((resolve, reject) => {
        ginkoAPI(
          methodPath,
          args,
          (data) => resolve(data), // Fonction API Ginko
          (err) => reject(err)
        );
      });
    };

    // 2. Fonction principale pour récupérer et afficher les horaires
    const afficherHoraires = async (nomArret) => {
      let fav_arret = JSON.parse(localStorage.getItem('fav_arrets')) || [];
      let trajets = {};
  
  const type = await type_arret()
  try {
    const response = await callGinko("TR/getTempsLieu", { nom: nomArret, nb:3 });
    if (fav_arret.includes(nomArret)) {
      if (type==="gare"){ boutons.innerHTML = `<a onclick="history.back()" class="buttons"><i class="fa-solid fa-arrow-left"></i></a>
                      <a href="carte.html?lat=${response.latitude}&lon=${response.longitude}&zoom=16" class="buttons"><i class="fa-solid fa-location-dot"></i></a>
                      <a onclick="toggle_fav()"" class="buttons"><i class="fa-solid fa-star"></i></a>
                      <a onclick="afficherTrains()" class="buttons"><i class="fa-solid fa-train"></i></a>`}
      
      else {boutons.innerHTML = `<a onclick="history.back()" class="buttons"><i class="fa-solid fa-arrow-left"></i></a>
                      <a href="carte.html?lat=${response.latitude}&lon=${response.longitude}&zoom=16" class="buttons"><i class="fa-solid fa-location-dot"></i></a>
                      <a onclick="toggle_fav()"" class="buttons"><i class="fa-solid fa-star"></i></a>
                      `
    }}
    else { if (type==="gare"){boutons.innerHTML = `<a onclick="history.back()" class="buttons"><i class="fa-solid fa-arrow-left"></i></a>
                      <a href="carte.html?lat=${response.latitude}&lon=${response.longitude}&zoom=16" class="buttons"><i class="fa-solid fa-location-dot"></i></a>
                      <a onclick="toggle_fav()"" class="buttons"><i class="fa-regular fa-star"></i></a>

      else {boutons.innerHTML = `<a onclick="history.back()" class="buttons"><i class="fa-solid fa-arrow-left"></i></a>
                      <a href="carte.html?lat=${response.latitude}&lon=${response.longitude}&zoom=16" class="buttons"><i class="fa-solid fa-location-dot"></i></a>
                      <a onclick="toggle_fav()"" class="buttons"><i class="fa-regular fa-star"></i></a>
                      `
    }}
    
                      // Boutons : Retour (dedicace aux utilisateur d'iphones :) )
                      //           Ouvrir dans menu carte
                      //           Ajouter/retirer des favoris

    
    
    console.log("Réponse de l'API :", response);

    
    const passages = response.listeTemps

    if (passages.length === 0) {
      conteneur.innerHTML = `<br><p class="lightmode">Aucun passage trouvé pour cet arrêt.</p>`;
      titre.innerHTML = `<h2>${nomArret}</h2>`;
      return;
    }
    let ordre = 1
    console.log(passages)
for (let index = 0; index < passages.length; index++) {
      let cletemp = passages[index]
      let part1 = cletemp.numLignePublic
      let part2 = cletemp.destination
      if (part1==='Ginko Citadelle'){part1="Cit."}
      if (part1==='Plan B'){part1="B"}
      let attente = cletemp.temps
      let statut = ""
      let moyen = ""
      let prio = 0
      if (part1===ligne) {
        if (part2===dest) {prio=2}
        else {prio=1}
      }
      
      if (part1==="T1"||part1==="T2") {moyen="tram"} else {moyen="bus"}
      if (attente==="0 min" && moyen==="bus"){attente=`<i class="fa-solid fa-bus-simple imminent"></i>`} // Affiche une icone de bus/tram
      if (attente==="0 min" && moyen==="tram"){attente=`<i class="fa-solid fa-train-tram imminent"></i>`}// lorsque l'arrivée est imminente
      let cle = part1+part2                                                                              // comme les écrans à quai
      if (!trajets[cle]) {
          trajets[cle] = {ligne: part1, destination: part2, temps: [attente], prio: prio}
      }
      else if (trajets[cle] && attente==="Non desservi") {trajets[cle].prio=-1;}

      else {
        trajets[cle].temps.push(attente)
      }
      ordre++
}
console.log(trajets)
    // 3. Affichage
   conteneur.innerHTML = Object.values(trajets).sort((a, b) => b.prio - a.prio).map((p => `<div class="passage tile-${p.ligne.toLowerCase()}">
          <strong><p class="line-dot line-${p.ligne.toLowerCase()} enlarge outline-${p.ligne.toLowerCase()}">${p.ligne}</p></strong> <p> 
         <strong>${p.destination}</strong>
          <br><span class="bulle"><strong>${p.temps.join(`</span></strong><strong><span class="bulle">`)}</strong></span></p></div>`)).join("");
    


  } catch (erreur) {
    console.error("Erreur :", erreur);
    conteneur.innerHTML = `<p style="color:red">Erreur : ${erreur}</p>`;
  }
  titre.innerHTML = `<h2>${nomArret}</h2>`;
  
  pagetitre.innerHTML = `Biloba - ${nomArret}`
  
};

  const urlParams = new URLSearchParams(window.location.search);

  const bar = document.querySelector(".insert");

 
  

  if (provenance === "GPS") {
    bar.innerHTML = `
      <li class="bar"><a href="index.html">Lignes</a></li>

      <li class="bar "><a href="favoris.html">Favoris</a></li>

      <li class="bar "><a href="favoris.html">Favoris</a></li>

    `;
  }
});
};
bottomBar(); afficherHoraires(arretcible);
setInterval(() => {if (isRunning==="Ginko"){afficherHoraires(arretcible)};}, 10000)

 // Rafraîchit les résultats tout les 10s selon les recommandations de Ginko
    
const toggle_fav = () => {
  console.log("Fonction invoquée!")
  let fav_arret = JSON.parse(localStorage.getItem('fav_arrets')) || [];
  if (fav_arret.includes(arretcible)) {
      const index = fav_arret.indexOf(arretcible);
      fav_arret.splice(index, 1)
      localStorage.setItem('fav_arrets', JSON.stringify(fav_arret));
      
      console.log("Favori retiré")
    }
    else {
      fav_arret.push(arretcible)
      localStorage.setItem('fav_arrets', JSON.stringify(fav_arret));
