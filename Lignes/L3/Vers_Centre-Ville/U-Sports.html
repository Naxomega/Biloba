<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="60" >

    <title>Biloba - Horaires Ginko</title>
    <link rel="stylesheet" href="style.css">
    <base href="/Biloba/">
    <script src="https://api.ginko.voyage/api.js?apiKey=319802f100daf2175550197669c3ef8d"></script>
    
</head>
<body>
    <div class="header">
        <h1 class="logo lightmode">Biloba</h1>
        <h3>Aussi léger qu'une feuille de Ginko</h3>
        <nav class="top-bar">
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="arrets.html">Arrêts</a></li>
                <li><a href="contribuer.html">Contribuer</a></li>
            </ul>
        </nav>
    </div>
    <div class="content">
        <h2 class="titre lightmode">Biloba</h2>
        <br>
        <div id="temps-reel">Chargement des horaires...</div>
        <script>

    
    const callGinko = (methodPath, args = {}) => {
      return new Promise((resolve, reject) => {
        ginkoAPI(
          methodPath,
          args,
          (data) => resolve(data),
          (err) => reject(err)
        );
      });
    };

    // 2. Fonction principale pour récupérer et afficher les horaires
    const afficherHoraires = async (nomArret, ligne, destination, destinationalt) => {
  const conteneur = document.querySelector("#temps-reel");
  const titre = document.querySelector('.titre');

  try {
    const response = await callGinko("TR/getTempsLieu", { nom: nomArret });
    
    
    console.log("Réponse de l'API :", response);

    
    const passages = response.listeTemps;
    if (passages.length == 0) {
      conteneur.innerHTML = "<p>Aucun passage trouvé pour cet arrêt.</p>";
      return;
    }

    // 3. Affichage
    conteneur.innerHTML = passages.filter((a) => a.numLignePublic===ligne && (a.destination===destination || a.destination===destinationalt))
      .map((p) => `
        <div class="passage tile-${ligne.toLowerCase()} lightmode">
          <strong><p class="line-dot line-${ligne.toLowerCase()} enlarge">${p.numLignePublic}</p></strong> <p> 
         <strong>${p.destination || p.direction || "?"}</strong> : 
          <em>${p.temps}</em></p>

        </div><br>
      `)
      .join("");

  } catch (erreur) {
    console.error("Erreur :", erreur);
    conteneur.innerHTML = `<p style="color:red">Erreur : ${erreur}</p>`;
  }
  titre.innerHTML = `Ligne ${ligne} vers ${destination}<br><br>${nomArret}`
  
};

//  Syntaxe : Arrêt, Ligne, Destination, Destiation Alternative
// Exemple : "Gare Viotte", "L3", "Pôle Temis", "Campus  Crous Université"
    afficherHoraires("U-Sports", "L3", "Centre-ville - 8 Septembre", "Centre-ville - République");
  </script>
        <br>
        <h3 class="list-title lightmode">Correspondances :</h3>
        <div class="line-dots">
            <p class="line-dot line-7">7</p>
        </div>
          <h3 class="liste-title lightmode">Lieux notables :</h3>
          <ul class="notable-list">
            <li class="lightmode">Campus de la Bouloie</li>
            <li class="lightmode">UFR STAPS</li>
          </ul>
    </div>
</body>
</html>
