    <script type="module">
      const callGinko = (methodPath, args = {}) => {
      return new Promise((resolve, reject) => {
        ginkoAPI(
          methodPath,
          args,
          (data) => resolve(data),
          (err) => reject(err)
        );
      });
    };
    let listearret = {};
    const arrets = await callGinko("DR/getArrets");
    for (let index = 0; index < arrets.length; index++) {
      let cletemp = arrets[index]
      let cle = cletemp.nom
      let lat = cletemp.latitude
      let lon = cletemp.longitude
    if (!listearret[cle]) {
          listearret[cle] = {nom: cle, latitude: lat, longitude: lon};
       }}
   
  import {LeafletMap, TileLayer, Marker, Circle, Polygon} from 'leaflet';
	const map = new LeafletMap('map').setView([47.250000, 6.033330], 13);
  new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
	maxZoom: 19,
	attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
console.log(Object.values(listearret))
Object.values(listearret).forEach(arret => {
  console.log("Arret : ", arret.nom)
        const lat = arret.latitude;
        const lon = arret.longitude;
        const nomArret = arret.nom;
        const nomSansEspace = nomArret.split(" ").join("")
        const nom = arret.nom;
        if (lat && lon) {

          const popup = new Marker([lat, lon], {customData: nom}).addTo(map);
          const popupContent = `
          <p>${nomArret}</p><div class="horaires-${nomSansEspace}""></div><br><a class="line-link" href="horaires.html?arret=${nom}&provenance=Carte">Voir plus</a>   
          
            `;
            
            popup.bindPopup(popupContent);
        }
        
})
map.on('popupopen', async (e) => {
  let trajets = {};
  const marqueur = e.popup._source;
  if (marqueur && marqueur.options && marqueur.options.customData) {
    const arretcible = marqueur.options.customData;
    const arretSansEspace = arretcible.split(" ").join("")
    const conteneur = document.querySelector(`.horaires-${arretSansEspace}`)
    const response = await callGinko("TR/getTempsLieu", { nom: arretcible, nb:2 });
    console.log(response)
     const passages = response.listeTemps

    
    
    console.log(passages)
for (let index = 0; index < passages.length; index++) {
      let cletemp = passages[index]
      let part1 = cletemp.numLignePublic
      let part2 = cletemp.destination
      if (part1==='Ginko Citadelle'){part1="Cit."}
      if (part1==='Plan B'){part1="B"}
      let attente = cletemp.temps
      let statut = ""
      let moyen = ""
      if (part1==="T1"||part1==="T2") {moyen="tram"} else {moyen="bus"}
      if (attente==="0 min" && moyen==="bus"){attente=`<i class="fa-solid fa-bus-simple imminent"></i>`} // Affiche une icone de bus/tram
      if (attente==="0 min" && moyen==="tram"){attente=`<i class="fa-solid fa-train-tram imminent"></i>`}// lorsque l'arrivée est imminente
      let cle = part1+part2                                                                              // comme les écrans à quai
      if (!trajets[cle]) {
          trajets[cle] = {ligne: part1, destination: part2, temps: [attente]}
      }
      else {
        trajets[cle].temps.push(attente)
      }
      
  }console.log(trajets)
  conteneur.innerHTML = Object.values(trajets).map((p => `<div class="passage tile-${p.ligne.toLowerCase()}">
          <strong><p class="line-dot line-${p.ligne.toLowerCase()} enlarge outline-${p.ligne.toLowerCase()}">${p.ligne}</p></strong> <p> 
         <strong>${p.destination}</strong>
          <br><span class="bulle"><strong>${p.temps.join(`</span></strong><strong><span class="bulle">`)}</strong></span></p></div>`)).join("");
  }
  })
</script>
