<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="60" >

    <title class="pagetitle">Biloba - Horaires Ginko</title>
    <link rel="stylesheet" href="style.css">
    <base href="/Biloba/">
    <script src="https://api.ginko.voyage/api.js?apiKey=r8B7t6Hgd7vF9V3VV9PQ4vc2a"></script>
    
</head>
<body>
    <div class="header">
        <h1 class="logo lightmode">Biloba beta</h1>
        <h2>Plus d'excuses pour rater votre bus !</h2>
        <nav class="top-bar">
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="arrets.html">Arrêts</a></li>
                <li><a href="contribuer.html">Contribuer</a></li>
            </ul>
        </nav>
    </div>
    <div class="content">
        <h2 class="titre lightmode">Biloba</h2>
        <br>
        <div class="line-container">Chargement des arrêts...</div>
        <script>
          // var globales
          const conteneur = document.querySelector(".line-container");
          const debugLat = 47.24878;
          const debugLon = 6.01815;
          let listearretsproche = {};
          const deltaLat = 0.0027; // envir. 300m
          const deltaLon = 0.00396; // envir. 300m
          // donc (300+300)x2 = recherche d'arrêt dans un carré de 600m de côté centré sur la position de l'utilisateur
          //    600m
          // +---------+
          // |         |
          // |    O    | 600m | O = utilisateur
          // |         |
          // +---------+
          //
          // promise gps
const getPosition = () => {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(resolve, reject, {
      enableHighAccuracy: true,
      timeout: 5000,
      maximumAge: 0
    });
  });
}; // promise api ginko
const callGinko = (methodPath, args = {}) => {
      return new Promise((resolve, reject) => {
        ginkoAPI(
          methodPath,
          args,
          (data) => resolve(data),
          (err) => reject(err)
        );
      });
    };

// fonction async principale
const chargerPositionGPS = async () => {
  try {

    // const pos = await getPosition();
    
    const Latitude = debugLat;  //pos.coords.latitude;
    const Longitude = debugLon; //pos.coords.longitude;
    try {
      const arrets = await callGinko("DR/getArrets");
      for (let index = 0; index < arrets.length; index++) {
      let cletemp = arrets[index]
      let cle = cletemp.nom
      let lat = cletemp.latitude
      let lon = cletemp.longitude
      if (!listearretsproche[cle]) {
          listearretsproche[cle] = {nom: cle, latitude: lat, longitude: lon};
       }}
      const arretsproches = Object.values(listearretsproche).filter(arret => {
        return (
          arret.latitude >= Latitude-deltaLat &&
          arret.latitude <= Latitude+deltaLat &&
          arret.longitude >= Longitude-deltaLon &&
          arret.longitude <= Longitude+deltaLon
        )}).map((a) => `<a href="horaires.html?arret=${a.nom}" class="line-link line-1"><span>${a.nom}</span></a><br>`).join("");  
        conteneur.innerHTML = arretsproches
    } catch {conteneur.innerHTML = "Impossible de récupérer les arrêts.";
    }

  } catch (error) {
    conteneur.innerHTML = "Impossible de récupérer votre position.";
    console.error(error);
  }
};


chargerPositionGPS();

  </script>
  

    </div>
</body>
</html>
